bind = "0.0.0.0:7000"
# Replace on both sides with the same value from: openssl rand -hex 32
# Keep legacy token, OR replace it with tokens = ["<secret-1>", "<secret-2>"].
# Each secret must be distinct, 32..4096 visible ASCII bytes. Never set both fields.
# All tokens share access to every mapping (and enabled CF probes).
token = "REPLACE_WITH_A_RANDOM_SECRET_AT_LEAST_32_BYTES"
tls_cert = "certs/server.pem"
tls_key = "certs/server-key.pem"

[[proxies]]
name = "web"
protocol = "tcp"
bind = "0.0.0.0:8080"
max_connections = 128

[[proxies]]
name = "dns"
protocol = "udp"
bind = "0.0.0.0:5353"
max_connections = 128
udp_timeout_secs = 60
