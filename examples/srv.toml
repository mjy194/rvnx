bind = "0.0.0.0:7000"
# Replace on both sides with the same value from: openssl rand -hex 32
token = "REPLACE_WITH_A_RANDOM_SECRET_AT_LEAST_32_BYTES"
tls_cert = "certs/server.pem"
tls_key = "certs/server-key.pem"

[[proxies]]
name = "web"
protocol = "tcp"
bind = "0.0.0.0:8080"
max_connections = 128

[[proxies]]
name = "dns"
protocol = "udp"
bind = "0.0.0.0:5353"
max_connections = 128
udp_timeout_secs = 60
